name: Build Windows package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Test the backend on Windows
        working-directory: backend
        run: go test ./...

      - name: Build the Windows executable and Chrome extension
        run: ./scripts/build.ps1

      - name: Assemble the installation ZIP
        run: ./scripts/package.ps1

      - name: Upload the Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: release/youtube-guardian-windows-x64.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 30


  release-assets:
    if: github.ref_type == 'tag'
    needs: windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the Windows ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: youtube-guardian-windows-x64.zip
          path: assets
          skip-decompress: true

      - name: Attach the ZIP to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]]; then
            printf 'Create a draft release for %s before uploading the package.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" assets/youtube-guardian-windows-x64.zip --repo "$GITHUB_REPOSITORY" --clobber
