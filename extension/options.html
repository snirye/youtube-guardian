<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<title>הגדרות YouTube Guardian</title>
<style>
body { font: 16px/1.5 system-ui; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
label { display: grid; gap: .35rem; margin: 1rem 0; }
input { padding: .5rem; }
button { font: inherit; padding: .45rem 1rem; }
</style>
<h1>חיבור לשרת המקומי</h1>
<form>
  <label>אסימון API
    <input id="token" dir="ltr" type="password" autocomplete="off" pattern="[a-fA-F0-9]{64}" required>
  </label>
  <label>יציאה
    <input id="port" dir="ltr" type="number" min="1" max="65535" value="8765" required>
  </label>
  <button>שמור</button>
  <p role="status"></p>
</form>
<script src="options.js"></script>
</html>
